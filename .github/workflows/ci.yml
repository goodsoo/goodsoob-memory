name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # 로컬 개발 bun 과 버전 핀 일치 (재현성). 미핀 시 CI 가 최신 bun 을 받아
          # lockfile 해석이 또 갈린다.
          bun-version: 1.3.14
      # --frozen-lockfile 안 씀 (의도): bun.lock 은 생성 플랫폼(맥 arm64)과 CI
      # (linux x64)에서 optional dep 항목이 미묘하게 달라, 맥에서 재생성한 lockfile
      # 도 linux frozen 검증에서 계속 diff 판정돼 install 이 죽었다. CI 목적은
      # typecheck+test 검증이지 lockfile 무결성 강제가 아니므로 일반 install 로 둔다.
      - run: bun install
      - run: bun run typecheck
      - run: bun run test:run
