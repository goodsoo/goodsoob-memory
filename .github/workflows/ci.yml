name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # 로컬 개발 bun 과 핀 일치 — 미핀 시 CI 가 최신 bun(예: 1.4.2)을 받아
          # 구버전으로 생성된 bun.lock 을 --frozen-lockfile 에서 diff 판정해 install
          # 단계가 죽었음. lockfile 생성 bun 을 올릴 때 이 값도 같이 올린다.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:run
